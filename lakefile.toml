name = "species"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Species"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.35.0"

[[lean_lib]]
name = "Species"

[[lean_lib]]
name = "SpeciesTest" # not in defaultTargets
globs = ["SpeciesTest.+"] # ensures that all files are run (no aggregator importing all submodules)
